server.port=${PORT:8080}
server.address=${JOBIFY_BIND:127.0.0.1}
spring.datasource.url=${JOBIFY_DB_URL:jdbc:h2:file:./data/jobify;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${JOBIFY_DB_USER:sa}
spring.datasource.password=${JOBIFY_DB_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${JOBIFY_SECURE_COOKIES:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.serialization.write-dates-as-timestamps=false
spring.web.resources.static-locations=classpath:/static/,file:../frontend/dist/
