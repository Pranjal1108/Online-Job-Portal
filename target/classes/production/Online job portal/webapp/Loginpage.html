<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Login & Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="FrontendStyle.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Offside&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Genos:ital,wght@0,100..900;1,100..900&display=swap">
</head>
<body>

<div class="container">
    <!-- Left Half (Image) -->
    <div class="left-half">
        <img alt="Image"
             class="image-side" src="https://images.unsplash.com/photo-1605106702842-01a887a31122?q=80&w=1887&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
    </div>

    <div class="home-btn-container">
        <a class="home-btn" href="Homepage.html">Home</a>
    </div>

    <div class="card-container" id="card-container">
        <div class="card" id="card">
            <!-- Login Form -->
            <div class="front">
                <div class="form-container">
                    <h2 class="form-title">Login</h2>

                    <!-- Login Form Updated -->
                    <form action="UserServlet" id="loginForm" method="POST">
                        <input class="form-input" name="email" placeholder="Email" required type="email">
                        <input class="form-input" name="password" placeholder="Password" required type="password">
                        <button class="form-btn" type="submit">Login</button>
                    </form>

                    <!-- Display error or success messages -->
                    <div class="alert-container" id="message-container">
                        <p class="alert alert-danger" id="error-msg" style="display: none;"></p>
                        <p class="alert alert-success" id="success-msg" style="display: none;"></p>
                    </div>

                    <p class="switch-link">Don't have an account? <a href="javascript:void(0);" onclick="flipCard()">Sign
                        Up</a></p>
                </div>
            </div>

            <!-- Sign-Up Form -->
            <div class="back">
                <div class="form-container">
                    <h2 class="form-title">Sign Up</h2>
                    <!-- Sign-Up Form Updated -->
                    <form action="SignUpServlet" id="signUpForm" method="POST">
                        <input class="form-input" name="username" placeholder="Username" required type="text">
                        <input class="form-input" name="email" placeholder="Email" required type="email">
                        <input class="form-input" name="password" placeholder="Password" required type="password">
                        <button class="form-btn" type="submit">Sign Up</button>
                    </form>
                    <p class="switch-link">Already have an account? <a href="javascript:void(0);" onclick="flipCard()">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function flipCard() {
        document.getElementById("card-container").classList.toggle("flipped");
    }

    // Handle error/success messages based on query parameters
    window.onload = function () {
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const success = urlParams.get('success');

        if (error) {
            document.getElementById('error-msg').innerText = error;
            document.getElementById('error-msg').style.display = 'block';
        }

        if (success) {
            document.getElementById('success-msg').innerText = success;
            document.getElementById('success-msg').style.display = 'block';
        }
    };
</script>

<script src="validation.js"></script>

</body>
</html>
